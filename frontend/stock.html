<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台股營收追蹤 - 詳細</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #111a2e;
        --muted: #9ca3af;
        --border: #1f2937;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: var(--bg);
        color: #e5e7eb;
      }
      header {
        padding: 18px 18px 6px 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .titleBlock {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      .caption {
        color: var(--muted);
        font-size: 13px;
      }
      .apiBar {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .apiBar input {
        width: 360px;
        max-width: 70vw;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        color: inherit;
        outline: none;
      }
      .apiBar button {
        background: #2563eb;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }
      .wrap {
        padding: 12px 18px 28px 18px;
      }
      .backBtn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        color: #e5e7eb;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
      }
      .sectionTitle {
        margin-top: 18px;
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 800;
      }
      .metricsGrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 900px) {
        .metricsGrid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 520px) {
        .metricsGrid {
          grid-template-columns: repeat(1, minmax(0, 1fr));
        }
      }
      .metricCard {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .metricLabel {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .metricValue {
        font-size: 22px;
        font-weight: 900;
      }
      .metricHelp {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.3;
      }

      .twoCols {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      @media (max-width: 900px) {
        .twoCols {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 8px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        text-align: right;
        font-size: 13px;
      }
      th {
        color: var(--muted);
        font-weight: 800;
        background: rgba(255, 255, 255, 0.02);
      }
      td:first-child, th:first-child {
        text-align: left;
      }
      .loading {
        padding: 18px;
        color: var(--muted);
      }
      .alert {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
      }
      .alert.success { background: rgba(16,185,129,0.12); color: #34d399; }
      .alert.error { background: rgba(239,68,68,0.12); color: #f87171; }
    </style>
  </head>
  <body>
    <header>
      <div class="titleBlock">
        <h1 id="pageTitle">個股詳細資訊</h1>
        <div class="caption" id="pageCaption">載入中...</div>
      </div>
      <div style="display:flex; gap:12px; align-items:center;">
        <button class="backBtn" id="backBtn">⬅ 返回總覽首頁</button>
        <!-- <div class="apiBar">
          <input id="apiBaseInput" type="text" placeholder="API Base URL（例如 http://localhost:8000）" />
          <button id="saveApiBase">儲存</button>
        </div> -->
      </div>
    </header>
    <div class="wrap">
      <div id="loading" class="loading">正在抓取資料...</div>
      <div id="content" style="display:none;">
        <div class="sectionTitle" id="earningsTitle">📊 營收進度</div>
        <div class="metricsGrid" id="metricsGrid"></div>

        <div class="twoCols">
          <div class="panel">
            <div class="sectionTitle" style="margin-top:0;">📈 月營收趨勢圖</div>
            <canvas id="revenueChart" height="360"></canvas>
          </div>
          <div class="panel">
            <div class="sectionTitle" style="margin-top:0;">📋 近二年詳細數據</div>
            <div style="overflow:auto; max-height: 380px;">
              <table id="dataTable">
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>月營收 (億)</th>
                    <th>單月年增率 (%)</th>
                    <th>累計營收 (億)</th>
                    <th>累計年增率 (%)</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="sectionTitle">💰 基本面股價觀測</div>
        <div id="valuationMetrics" class="metricsGrid"></div>
        <div id="conclusion" style="display:none;" class="alert"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="stock.js"></script>
  </body>
</html>
