<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>睡得著的投資 - 個股</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #080c10;
      --surface:   #0d1117;
      --surface2:  #111820;
      --border:    #1c2530;
      --border2:   #243040;
      --text:      #cdd5e0;
      --muted:     #4a5f72;
      --muted2:    #6b8096;
      --accent:    #00d4ff;
      --accent2:   #0095b3;
      --green:     #00e676;
      --green-dim: #00a352;
      --red:       #ff3d5a;
      --red-dim:   #b02038;
      --orange:    #ff9800;
      --gold:      #ffd740;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans TC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,212,255,0.012) 2px,
        rgba(0,212,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 16px;
      border-right: 1px solid var(--border);
      height: 100%;
    }

    .logo-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .logo-text {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--muted2);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .header-stock-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 4px;
    }

    .header-stock-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .header-stock-name {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #clock {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted2);
    }

    /* ── HERO STRIP ── */
    .hero-strip {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .hero-price-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-price-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hero-price {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .hero-price-unit {
      font-size: 14px;
      color: var(--muted2);
      font-weight: 400;
    }

    .hero-divider {
      width: 1px;
      height: 40px;
      background: var(--border);
      flex-shrink: 0;
    }

    .hero-kpi {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-kpi-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-kpi-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .hero-kpi-value.green { color: var(--green); }
    .hero-kpi-value.red   { color: var(--red); }
    .hero-kpi-value.gold  { color: var(--gold); }
    .hero-kpi-value.accent { color: var(--accent); }

    /* ── MAIN LAYOUT ── */
    .wrap { padding: 16px 20px 40px; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      margin-top: 20px;
    }

    .section-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── METRICS GRID ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 4px;
    }

    @media (max-width: 760px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .metrics-grid { grid-template-columns: 1fr; } }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      transition: border-color 0.2s;
    }

    .metric-card:hover { border-color: var(--border2); }

    .metric-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .metric-value {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .metric-help {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.4;
    }

    /* ── CHART + TABLE ROW ── */
    .two-cols {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    @media (max-width: 900px) { .two-cols { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
    }

    .panel-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--muted2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── TABLE ── */
    .table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 380px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
    }

    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-align: right;
      font-size: 11px;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.02);
      position: sticky;
      top: 0;
    }

    td:first-child, th:first-child { text-align: left; }

    tr:hover td { background: rgba(255,255,255,0.025); }

    /* ── CONCLUSION BANNER ── */
    .conclusion {
      border-radius: 6px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      display: none;
      border-left: 3px solid;
    }

    .conclusion.success {
      background: rgba(0,230,118,0.08);
      color: var(--green);
      border-left-color: var(--green);
    }

    .conclusion.error {
      background: rgba(255,61,90,0.08);
      color: var(--red);
      border-left-color: var(--red);
    }

    /* ── LOADING ── */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 16px;
    }

    .loading-bar {
      width: 200px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      left: -60%;
      top: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: loading-sweep 1.2s infinite;
    }

    @keyframes loading-sweep { to { left: 160%; } }

    .loading-text {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── FADE-IN ── */
    .fade-in {
      opacity: 0;
      animation: fadeIn 0.4s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>

<header>
  <div class="logo-block">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 64" width="30" height="34">
        <polygon points="28,2 52,16 52,44 28,58 4,44 4,16" fill="#110e00" stroke="#ffd740" stroke-width="2.5"/>
        <polygon points="28,8 47,19 47,41 28,53 9,41 9,19" fill="none" stroke="#ffd740" stroke-width="0.8" opacity="0.35"/>
        <circle cx="28" cy="30" r="14" fill="#ffd740"/>
        <circle cx="35" cy="23" r="11" fill="#110e00"/>
        <circle cx="44" cy="14" r="1.8" fill="#ffd740" opacity="0.7"/>
        <circle cx="49" cy="21" r="1.2" fill="#ffd740" opacity="0.5"/>
        <circle cx="42" cy="19" r="1.0" fill="#ffd740" opacity="0.4"/>
      </svg>
    </div>
    <div class="logo-text">SLEEP WELL INVEST</div>
  </div>
  <button class="back-btn" id="backBtn">← BACK</button>
  <div class="header-stock-info">
    <div class="header-stock-id" id="headerStockId">----</div>
    <div class="header-stock-name" id="headerStockName">載入中...</div>
  </div>
  <div class="header-right">
    <div id="clock">--:--:--</div>
  </div>
</header>

<!-- Hero strip: key numbers at top -->
<div class="hero-strip" id="heroStrip" style="display:none;">
  <div class="hero-price-block">
    <div class="hero-price-label">LAST PRICE</div>
    <div class="hero-price" id="heroPrice">—<span class="hero-price-unit"> 元</span></div>
  </div>
  <div class="hero-divider"></div>
  <div class="hero-kpi">
    <div class="hero-kpi-label">本益比</div>
    <div class="hero-kpi-value" id="heroPE">—</div>
  </div>
  <div class="hero-divider"></div>
  <div class="hero-kpi">
    <div class="hero-kpi-label">YTD 達成率</div>
    <div class="hero-kpi-value green" id="heroAchieve">—</div>
  </div>
  <div class="hero-divider"></div>
  <div class="hero-kpi">
    <div class="hero-kpi-label">股價波動位階</div>
    <div class="hero-kpi-value gold" id="heroVolatility">—</div>
  </div>
  <div class="hero-divider"></div>
  <div class="hero-kpi">
    <div class="hero-kpi-label">推估殖利率</div>
    <div class="hero-kpi-value accent" id="heroYield">—</div>
  </div>
  <div class="hero-divider"></div>
  <div class="hero-kpi">
    <div class="hero-kpi-label">資料更新日期</div>
    <div class="hero-kpi-value" id="heroDate" style="color:var(--muted2); font-size:14px;">—</div>
  </div>
</div>

<div class="wrap">
  <div id="loading" class="loading-screen">
    <div class="loading-bar"></div>
    <div class="loading-text">抓取個股資料中...</div>
  </div>

  <div id="content" style="display:none;">

    <!-- Revenue Metrics -->
    <div class="section-header">
      <div class="section-title">📊 營收進度</div>
      <div class="section-line"></div>
    </div>
    <div class="metrics-grid" id="revenueMetrics"></div>

    <!-- Chart + Table -->
    <div class="section-header" style="margin-top:16px;">
      <div class="section-title">月營收走勢</div>
      <div class="section-line"></div>
    </div>
    <div class="two-cols">
      <div class="panel">
        <div class="panel-title">月營收 (億元)</div>
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="panel">
        <div class="panel-title">近二年明細</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>月收(億)</th>
                <th>月年增率 %</th>
                <th>累計(億)</th>
                <th>累計年增率 %</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Valuation Metrics -->
    <div class="section-header">
      <div class="section-title">💰 基本面估價</div>
      <div class="section-line"></div>
    </div>
    <div class="metrics-grid" id="valuationMetrics"></div>

    <!-- Conclusion -->
    <div style="margin-top:10px;">
      <div class="conclusion" id="conclusion"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="stock.js"></script>
</body>
</html>
