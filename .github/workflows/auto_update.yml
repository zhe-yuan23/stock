name: 台股自動更新排程

on:
  schedule:
    # 台灣時間 (UTC+8) 的 15:00，等於 UTC 的 07:00。
    # 設定為 '0 7 * * 1-5' 代表：每週一到週五的台灣時間下午 15:00 自動執行(分 時 日期 月分 星期)
    - cron: '0 6 * * 1-5'
  
  # 允許你在 GitHub 網頁上手動點擊 "Run workflow" 測試
  workflow_dispatch: 

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 取得儲存庫程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: 3. 安裝所需套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 執行總排程腳本 (每日盤後 + 月營收)
      run: |
        python src/update_job.py

    - name: 5. 提交並推播更新後的 CSV 檔案到 GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/
        git commit -m "🤖 自動更新：台股盤後與營收資料" || echo "今天沒有新資料需要更新"
        git push